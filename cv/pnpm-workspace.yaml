# Supply-chain cooldown: never install a version published in the last 15 days.
# 15 days = 15 * 24 * 60 = 21600 minutes. pnpm resolves to the newest version
# that is at least this old, so freshly-published (potentially compromised)
# releases are ignored until they've had time to be vetted / yanked.
minimumReleaseAge: 21600
# Packages exempted from the cooldown (e.g. if you ever need an urgent hotfix).
# The Next.js framework packages are pinned to exact versions in package.json,
# so exempting them lets a fresh security patch land without waiting out the
# 15-day window. The lockfile still pins whatever actually gets resolved.
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - eslint-config-next
  - postcss
  # Forced below via `overrides` to patched CVE releases that are still inside
  # the cooldown window; exempt so the security pin can actually resolve.
  - brace-expansion

# Prefer the lockfile: pnpm install uses exactly what's in pnpm-lock.yaml and
# only re-resolves when the lockfile is out of sync with package.json.
# (This is pnpm's default; pinned here to make the intent explicit.)
preferFrozenLockfile: true

# Security overrides: force patched versions of vulnerable transitive deps
# without pulling in breaking major bumps. Overrides for packages not present
# in the tree are simply ignored, so this list is also forward-looking.
# The @types/react* pins preserve this project's original package.json overrides.
overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  minimatch@<3.1.3: ^3.1.5
  flatted@<3.4.0: ^3.4.2
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  ajv@<6.14.0: ^6.15.0
  diff@<4.0.4: ^4.0.4
  lodash@<4.17.24: ^4.18.1
  # GHSA-4x5r-pxfx-6jf8: arbitrary file read via sourceMappingURL. Pulled in
  # <=7.29.0 transitively by next>styled-jsx and eslint-plugin-react-hooks.
  '@babel/core@<7.29.1': ^7.29.7

# Allow build scripts only for trusted first-party/build tooling. Every other
# package's install scripts (the #1 supply-chain execution vector) stay blocked.
allowBuilds:
  sharp: true
  unrs-resolver: true
